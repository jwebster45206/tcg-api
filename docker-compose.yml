services:
  tcg-api:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      - ENV=development
      - PORT=8080
    volumes:
      - ./config.docker.json:/app/config.json:ro
    depends_on:
      - mysql
    networks:
      - tcg-network

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: tcg_db
      MYSQL_USER: tcg_user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      # Schema and seed files
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql:ro
      # Optional: Uncomment for persistent storage during development
      # - mysql_data:/var/lib/mysql
    networks:
      - tcg-network

networks:
  tcg-network:
    driver: bridge

# Optional: Uncomment for persistent storage
# volumes:
#   mysql_data:
