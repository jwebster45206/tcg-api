services:
  tcg-api:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      - ENV=development
      - PORT=8080
    volumes:
      - ./config.docker.json:/app/config.json:ro
    depends_on:
      - mysql
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      timeout: 10s
      retries: 5
      interval: 10s
      start_period: 40s
    networks:
      - tcg-network

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: tcg
      MYSQL_USER: tcg_user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      # Schema and seed files
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql:ro
      # Optional: Uncomment for persistent storage during development
      # - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      timeout: 10s
      retries: 5
      interval: 10s
      start_period: 30s
    networks:
      - tcg-network

networks:
  tcg-network:
    driver: bridge

# Optional: Uncomment for persistent storage
# volumes:
#   mysql_data:
